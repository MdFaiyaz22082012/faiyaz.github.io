<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Faiyaz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *{
      box-sizing:border-box;
    }
    body{
      margin:0;
      background:#080808;
      color:#eaeaea;
      font-family: "Georgia", serif;
      display:flex;
      justify-content:center;
    }
    .container{
      max-width:700px;
      padding:80px 30px;
    }
    h1{
      font-size:42px;
      font-weight:normal;
      letter-spacing:3px;
      margin-bottom:80px;
    }
    .shayari{
      font-size:22px;
      line-height:2;
      margin-bottom:70px;
    }
    .divider{
      width:60px;
      height:1px;
      background:#444;
      margin:60px 0;
    }
    footer{
      margin-top:120px;
      font-size:14px;
      color:#777;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>FAIYAZ</h1>

    <div class="shayari">
      Tum lafz ho,<br>
      aur main khamoshi —<br>
      phir bhi har baat<br>
      tumse hi shuru hoti hai.
    </div>

    <div class="divider"></div>

    <div class="shayari">
      Kuch log samajhne ke liye nahi hote,<br>
      sirf mehsoos karne ke liye hote hain.
    </div>

    <footer>
      © Faiyaz
    </footer>
  </div>

</body>
</html>
