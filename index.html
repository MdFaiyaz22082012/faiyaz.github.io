<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faiyaz — Shayari Diwan</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Playfair+Display:ital@0;1&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* BACKGROUND */
body{
    background:#0f0f0f;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    font-family:'Playfair Display', serif;
}

/* PAGE */
.page{
    width:800px;
    min-height:1100px;
    background:
        linear-gradient(rgba(255,255,255,0.02), rgba(255,255,255,0.02)),
        url('https://www.transparenttextures.com/patterns/paper-fibers.png');
    background-color:#f6f1e7;
    border:1px solid rgba(0,0,0,0.25);
    padding:80px 90px;
    position:relative;
}

/* DIWAN BORDER */
.page::before{
    content:"";
    position:absolute;
    top:30px;
    left:30px;
    right:30px;
    bottom:30px;
    border:2px solid rgba(0,0,0,0.15);
    pointer-events:none;
}

/* TOP NAME */
.name-calligraphy{
    text-align:center;
    font-family:'Great Vibes', cursive;
    font-size:72px;
    color:#2b2b2b;
    margin-bottom:10px;
}

/* TAGLINE */
.tagline{
    text-align:center;
    font-family:'Cinzel', serif;
    letter-spacing:4px;
    font-size:14px;
    color:#555;
    margin-bottom:120px;
}

/* SHAYARI */
.shayari{
    text-align:center;
    font-size:28px;
    line-height:1.8;
    color:#1f1f1f;
    padding:0 40px;
}

/* ADOPTED */
.adopted{
    text-align:center;
    font-style:italic;
    margin-top:30px;
    color:#666;
}

/* NEXT PAGE TEXT */
.next-page{
    position:absolute;
    bottom:150px;
    width:100%;
    text-align:center;
    font-family:'Cinzel', serif;
    letter-spacing:3px;
    font-size:14px;
    color:#555;
}

/* PAGE NUMBER */
.page-number{
    position:absolute;
    bottom:80px;
    width:100%;
    text-align:center;
    font-family:'Cinzel', serif;
    font-size:16px;
    letter-spacing:2px;
    color:#222;
}

/* FOOTER */
.footer{
    position:absolute;
    bottom:40px;
    width:100%;
    text-align:center;
    font-size:12px;
    color:#555;
}
</style>
</head>

<body>

<div class="page">

    <!-- NAME -->
    <div class="name-calligraphy">Faiyaz</div>

    <!-- TAGLINE -->
    <div class="tagline">SHAYARI · POETRY · CREATIVITY</div>

    <!-- SHAYARI CONTENT -->
    <div class="shayari">
        Na kurta, na pathani salwaar,<br>
        Mard wo hai jo dil de,<br>
        warna sab bekaar.
    </div>

    <!-- ADOPTED CREDIT -->
    <div class="adopted">~ adopted ~</div>

    <!-- NEXT PAGE -->
    <div class="next-page">Next page · New dream</div>

    <!-- PAGE NUMBER -->
    <div class="page-number">— 02 —</div>

    <!-- FOOTER -->
    <div class="footer">© Faiyaz</div>

</div>

</body>
</html>
