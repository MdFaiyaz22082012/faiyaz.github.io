<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faiyaz — Shayari</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080808;
  color:#eaeaea;
  font-family:"Georgia", serif;
  display:flex;
  justify-content:center;
}

/* MAIN CONTAINER */
.container{
  max-width:760px;
  padding:90px 35px;
}

/* SCROLL OUTLINE */
.scroll{
  border:2px solid rgba(200,170,90,0.65);
  padding:70px 40px;
  position:relative;
  box-shadow:
    inset 0 0 25px rgba(200,170,90,0.15),
    0 0 40px rgba(0,0,0,0.8);
}

/* CORNERS – ANCIENT FEEL */
.scroll::before,
.scroll::after{
  content:"";
  position:absolute;
  width:40px;
  height:40px;
  border:2px solid rgba(200,170,90,0.7);
}

.scroll::before{
  top:-2px;
  left:-2px;
  border-right:none;
  border-bottom:none;
}

.scroll::after{
  bottom:-2px;
  right:-2px;
  border-left:none;
  border-top:none;
}

/* TITLE */
h1{
  font-size:40px;
  font-weight:normal;
  letter-spacing:3px;
  margin-bottom:35px;
  text-align:center;
}

/* INTRO */
.intro{
  font-size:15px;
  letter-spacing:2px;
  color:#999;
  text-align:center;
  margin-bottom:70px;
  opacity:0;
  animation: fadeUp 1.2s ease forwards;
  animation-delay:0.2s;
}

/* SHAYARI */
.shayari{
  font-size:24px;
  line-height:2;
  text-align:center;
  opacity:0;
  transform: translateY(25px);
  animation: fadeUp 1.5s ease forwards;
  animation-delay:0.6s;
}

/* ANIMATION */
@keyframes fadeUp{
  to{
    opacity:1;
    transform: translateY(0);
  }
}

/* FOOTER */
footer{
  margin-top:120px;
  text-align:center;
  font-size:13px;
  color:#666;
  letter-spacing:1px;
}

/* SOCIAL */
.social{
  margin-top:20px;
  display:flex;
  justify-content:center;
  gap:22px;
}

.social a{
  display:flex;
  align-items:center;
  gap:6px;
  color:#aaa;
  text-decoration:none;
  font-size:12px;
}

.social svg{
  width:16px;
  height:16px;
  fill:none;
  stroke:#eaeaea;
  stroke-width:1.6;
}
</style>
</head>

<body>
  <div class="container">
    <div class="scroll">

      <h1>Faiyaz</h1>

      <div class="intro">
        SHAYARI • WORDS • QUIET CREATIVITY
      </div>

      <div class="shayari">
        “Jo kismat me nahi hota na,<br>
        usse mohabbat kamaal ki hoti hai.”
      </div>

    </div>

    <footer>
      © Faiyaz

      <div class="social">

        <!-- Instagram -->
        <a href="https://instagram.com/faiyaz.1213" target="_blank">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r="0.8"></circle>
          </svg>
          instagram.com/faiyaz.1213
        </a>

        <!-- Mail -->
        <a href="mailto:mdfaiyaz22082012@gmail.com">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <polyline points="3,7 12,13 21,7"></polyline>
          </svg>
          mdfaiyaz22082012@gmail.com
        </a>

      </div>
    </footer>
  </div>
</body>
</html>
