<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Faiyaz — Tech Poetry</title>

<!-- ICONS -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", system-ui, sans-serif;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
}

/* CONTAINER */
.wrapper {
  height: 200vh;
  transition: transform 1s cubic-bezier(.77,0,.18,1);
}

/* COMMON PAGE STYLE */
.page {
  height: 100vh;
  width: 100%;
  position: relative;
  padding: 60px 40px;
}

/* LOGO */
.logo {
  font-size: 56px;
  font-weight: 700;
  letter-spacing: 6px;
  text-align: center;
  animation: glitch 2s infinite;
}

@keyframes glitch {
  0% { text-shadow: 0 0 0 #fff; }
  20% { text-shadow: -2px 0 #fff; }
  40% { text-shadow: 2px 0 #fff; }
  60% { text-shadow: -1px 0 #fff; }
  100% { text-shadow: 0 0 0 #fff; }
}

/* TAGLINE */
.tagline {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
  letter-spacing: 4px;
  opacity: 0.7;
}

/* MAIN TEXT */
.center-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  font-size: 26px;
  line-height: 1.6;
  max-width: 800px;
  animation: fadeUp 1.5s ease forwards;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translate(-50%, -40%); }
  to { opacity: 1; transform: translate(-50%, -50%); }
}

/* PAGE NUMBER */
.page-no {
  position: absolute;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  letter-spacing: 4px;
  opacity: 0.6;
}

/* NEXT BUTTON */
.next-btn {
  position: absolute;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  border: 1px solid #fff;
  padding: 10px 22px;
  background: transparent;
  color: #fff;
  cursor: pointer;
  letter-spacing: 3px;
  transition: all 0.3s ease;
}

.next-btn:hover {
  background: #fff;
  color: #000;
}

/* FOOTER ICONS */
.footer {
  position: absolute;
  bottom: 120px;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 30px;
}

.footer a {
  color: #fff;
  font-size: 18px;
  opacity: 0.7;
  transition: 0.3s;
}

.footer a:hover {
  opacity: 1;
  transform: scale(1.1);
}

/* PAGE 2 DESIGN ELEMENT */
.tech-lines {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}
</style>
</head>

<body>

<div class="wrapper" id="wrapper">

  <!-- PAGE 1 -->
  <section class="page">
    <div class="logo">FAIYAZ</div>
    <div class="tagline">SHAYARI · POETRY · CREATIVITY</div>

    <div class="center-text">
      Silence speaks when words collapse.<br>
      Not every emotion needs noise.
    </div>

    <div class="footer">
      <a href="https://instagram.com/faiyaz.1213" target="_blank">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="mailto:mdfaiyazz2082012@gmail.com">
        <i class="fa-solid fa-envelope"></i>
      </a>
    </div>

    <button class="next-btn" onclick="goNext()">NEXT PAGE</button>
    <div class="page-no">-01-</div>
  </section>

  <!-- PAGE 2 -->
  <section class="page">
    <div class="tech-lines"></div>

    <div class="center-text">
      “Na kurta, na pathani salwaar,<br>
      mard wo hai jo dil de,<br>
      warna sab bekaar.”<br><br>
      <span style="opacity:.6;font-size:14px;">~ adopted ~</span>
    </div>

    <div class="footer">
      <a href="https://instagram.com/faiyaz.1213" target="_blank">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="mailto:mdfaiyazz2082012@gmail.com">
        <i class="fa-solid fa-envelope"></i>
      </a>
    </div>

    <div class="page-no">-02-</div>
  </section>

</div>

<script>
let page = 0;
const wrapper = document.getElementById("wrapper");

function goNext() {
  page = Math.min(page + 1, 1);
  wrapper.style.transform = `translateY(-${page * 100}vh)`;
}

function goPrev() {
  page = Math.max(page - 1, 0);
  wrapper.style.transform = `translateY(-${page * 100}vh)`;
}

/* KEYBOARD NAV */
document.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") goNext();
  if (e.key === "ArrowUp") goPrev();
});
</script>

</body>
</html>
