<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Faiyaz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      background:#080808;
      color:#eaeaea;
      font-family:"Georgia", serif;
      scroll-behavior:smooth;
    }

    .container{
      height:100vh;
      overflow-y:scroll;
      scroll-snap-type:y mandatory;
    }

    .section{
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      scroll-snap-align:start;
      padding:40px;
    }

    .content{
      max-width:700px;
      text-align:left;
    }

    h1{
      font-size:44px;
      letter-spacing:4px;
    }

    .shayari{
      font-size:26px;
      line-height:2;
      opacity:0;
      transform:translateY(40px);
      transition: all 1.4s ease;
    }

    .shayari.show{
      opacity:1;
      transform:translateY(0);
    }

    footer{
      margin-top:80px;
      font-size:13px;
      color:#555;
      letter-spacing:1px;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- TITLE -->
    <section class="section">
      <div class="content">
        <h1>FAIYAZ</h1>
      </div>
    </section>

    <!-- SHAYARI -->
    <section class="section">
      <div class="content">
        <div class="shayari">
          Jo kismat mein nahi hota na,<br>
          usse mohabbat<br>
          kamaal ki hoti hai.
        </div>

        <footer>
          © Faiyaz
        </footer>
      </div>
    </section>

  </div>

  <!-- ANIMATION TRIGGER -->
  <script>
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add("show");
        }
      });
    }, { threshold: 0.6 });

    document.querySelectorAll(".shayari").forEach(el => {
      observer.observe(el);
    });
  </script>

</body>
</html>
