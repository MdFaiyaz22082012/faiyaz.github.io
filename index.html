<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080808;
  display:flex;
  justify-content:center;
  color:#2b1a05;
}

/* SCROLL CONTAINER */
.scroll{
  background:url("scroll.png") no-repeat center;
  background-size:contain;
  width:760px;
  min-height:900px;
  padding:220px 120px 180px;

/* ARABIC CALLIGRAPHY NAME */
.name{
  font-family:"Noto Nastaliq Urdu", serif;
  font-size:64px;
  margin-bottom:40px;
}

/* INTRO */
.intro{
  font-size:14px;
  letter-spacing:3px;
  color:#5c3b12;
  margin-bottom:90px;
}

/* SHAYARI */
.shayari{
  font-size:26px;
  line-height:2.1;
  font-family:"Noto Nastaliq Urdu", serif;
  opacity:0;
  transform: translateY(30px);
  animation: fadeUp 1.6s ease forwards;
}

/* ANIMATION */
@keyframes fadeUp{
  to{
    opacity:1;
    transform: translateY(0);
  }
}

/* FOOTER */
footer{
  margin-top:140px;
  font-size:13px;
  color:#5c3b12;
}

/* SOCIAL */
.social{
  margin-top:18px;
  display:flex;
  justify-content:center;
  gap:24px;
}

.social a{
  display:flex;
  align-items:center;
  gap:6px;
  color:#5c3b12;
  text-decoration:none;
  font-size:12px;
}

.social svg{
  width:16px;
  height:16px;
  fill:none;
  stroke:#5c3b12;
  stroke-width:1.6;
}
</style>
</head>
