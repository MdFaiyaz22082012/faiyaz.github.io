<!DOCTYPE html>
<html>
<head>
  <title>Faiyaz — Shayari</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{
      margin:0;
      padding:40px;
      background:#0b0b0b;
      color:#f2f2f2;
      font-family: "Georgia", serif;
    }
    h1{
      text-align:center;
      letter-spacing:2px;
    }
    .shayari{
      max-width:700px;
      margin:60px auto;
      font-size:20px;
      line-height:1.9;
    }
  </style>
</head>
<body>
  <h1>Faiyaz</h1>

  <div class="shayari">
    Tum lafz ho,<br>
    aur main khamoshi —<br>
    phir bhi har baat tumse hi shuru hoti hai.
  </div>

</body>
</html>
